name: Build All Platforms

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  FLUTTER_VERSION: '3.47.4'
  JAVA_VERSION: '17'

# ═══════════════════════════════════════════════════════
#  PARALLEL JOBS — quality gate first, then platform builds
# ═══════════════════════════════════════════════════════
jobs:

  # ─────────────────────────────────────────────────────
  #  QUALITY GATE — analyze + tests
  # ─────────────────────────────────────────────────────
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

  # ─────────────────────────────────────────────────────
  #  ANDROID APK (debug + release)
  # ─────────────────────────────────────────────────────
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

      - name: Upload APK (universal)
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ─────────────────────────────────────────────────────
  #  ANDROID AAB (Play Store bundle)
  # ─────────────────────────────────────────────────────
  android-aab:
    name: Android AAB
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # ─────────────────────────────────────────────────────
  #  WINDOWS
  # ─────────────────────────────────────────────────────
  windows:
    name: Windows
    runs-on: windows-latest
    needs: test
    env:
      CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Build MSIX
        run: dart run msix:create --install-certificate false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/windows/x64/runner/Release/
          retention-days: 14

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: build/windows/x64/runner/Release/fcine.msix
          retention-days: 14

  # ─────────────────────────────────────────────────────
  #  LINUX
  # ─────────────────────────────────────────────────────
  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux
        run: flutter build linux --release

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: build/linux/x64/release/bundle/
          retention-days: 14

  # ─────────────────────────────────────────────────────
  #  macOS
  # ─────────────────────────────────────────────────────
  macos:
    name: macOS
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS
        run: flutter build macos --release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/Build/Products/Release/
          retention-days: 14

  # ─────────────────────────────────────────────────────
  #  WEB
  # ─────────────────────────────────────────────────────
  web:
    name: Web
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 14

  # ─────────────────────────────────────────────────────
  #  SUMMARY — runs after all builds complete
  # ─────────────────────────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, android-apk, android-aab, windows, linux, macos, web]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List all artifacts
        run: |
          echo "════════════════════════════════════════"
          echo "  BUILD ARTIFACTS SUMMARY"
          echo "════════════════════════════════════════"
          find artifacts/ -type f | head -50
          echo ""
          echo "Total artifact files:"
          find artifacts/ -type f | wc -l

      - name: Comment on PR with artifacts
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = `## ✅ Build Complete

            | Stage | Status |
            |-------|--------|
            | Analyze & Test | \${{ needs.test.result }} |
            | Android APK | \${{ needs.android-apk.result }} |
            | Android AAB | \${{ needs.android-aab.result }} |
            | Windows | \${{ needs.windows.result }} |
            | Linux | \${{ needs.linux.result }} |
            | macOS | \${{ needs.macos.result }} |
            | Web | \${{ needs.web.result }} |

            All artifacts are available in the workflow run.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
