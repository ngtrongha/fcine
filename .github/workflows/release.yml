name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

env:
  FLUTTER_VERSION: '3.47.4'
  JAVA_VERSION: '17'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────
  #  VERIFY — tag must match pubspec.yaml version
  # ─────────────────────────────────────────────────────
  verify:
    name: Verify Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Check tag matches pubspec version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "Tag version:    $TAG_VERSION"
          echo "Pubspec version: $PUBSPEC_VERSION"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match pubspec.yaml version '$PUBSPEC_VERSION'. Update pubspec.yaml or use the correct tag."
            exit 1
          fi

  # ─────────────────────────────────────────────────────
  #  ANDROID — APK + AAB
  # ─────────────────────────────────────────────────────
  android:
    name: Android Release
    runs-on: ubuntu-latest
    needs: verify
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/fcine-release.jks
          cat > android/key.properties <<EOF
          storeFile=fcine-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab

  # ─────────────────────────────────────────────────────
  #  WINDOWS
  # ─────────────────────────────────────────────────────
  windows:
    name: Windows Release
    runs-on: windows-latest
    needs: verify
    env:
      MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Create portable ZIP
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "fcine-windows.zip"

      - name: Build MSIX (signed)
        if: env.MSIX_CERTIFICATE_BASE64 != ''
        env:
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: dart run msix:create -c windows\fcine-msix.pfx -p "$env:MSIX_CERTIFICATE_PASSWORD" --install-certificate false

      - name: Build MSIX (test certificate fallback)
        if: env.MSIX_CERTIFICATE_BASE64 == ''
        run: dart run msix:create --install-certificate false

      - name: Move MSIX out of build dir
        run: Move-Item "build\windows\x64\runner\Release\fcine.msix" "fcine.msix"

      - name: Include MSIX certificate in release
        if: env.MSIX_CERTIFICATE_BASE64 != ''
        run: Copy-Item "windows\fcine-msix.cer" "fcine-msix.cer"

      - name: Extract app version
        id: appver
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: ').Line -replace 'version: *', '' -replace '\+.*', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Inno Setup
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }

      - name: Build portable installer (Inno Setup)
        run: & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION=${{ steps.appver.outputs.version }} "windows\installer\fcine.iss"

      - name: Build MSIX installer (cert + msix)
        if: env.MSIX_CERTIFICATE_BASE64 != ''
        run: & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION=${{ steps.appver.outputs.version }} "windows\installer\fcine-msix.iss"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            fcine-windows.zip
            fcine.msix
            fcine-msix.cer
            dist/fcine-windows-setup.exe
            dist/fcine-windows-msix-setup.exe

  # ─────────────────────────────────────────────────────
  #  LINUX
  # ─────────────────────────────────────────────────────
  linux:
    name: Linux Release
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux
        run: flutter build linux --release

      - name: Create tar.gz
        run: tar -czf fcine-linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: fcine-linux.tar.gz

  # ─────────────────────────────────────────────────────
  #  macOS
  # ─────────────────────────────────────────────────────
  macos:
    name: macOS Release
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS
        run: flutter build macos --release

      - name: Create ZIP
        run: ditto -c -k --sequesterRsrc "build/macos/Build/Products/Release/F-Cine.app" fcine-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: fcine-macos.zip

  # ─────────────────────────────────────────────────────
  #  WEB
  # ─────────────────────────────────────────────────────
  web:
    name: Web Release
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: flutter build web --release --web-renderer canvaskit --base-href "/"

      - name: Create tar.gz
        run: tar -czf fcine-web.tar.gz -C build/web .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: fcine-web.tar.gz

  # ─────────────────────────────────────────────────────
  #  CREATE GITHUB RELEASE
  # ─────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [android, windows, linux, macos, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Generate SHA256 checksums
        run: |
          for f in artifacts/*/*; do
            sha256sum "$f" | awk -v f="$(basename "$f")" '{print $1 "  " f}' >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Release ${{ github.event.inputs.tag || github.ref_name }}"
          draft: true
          generate_release_notes: true
          files: |
            artifacts/android-release/*
            artifacts/windows-release/*
            artifacts/linux-release/*
            artifacts/macos-release/*
            artifacts/web-release/*
            SHA256SUMS.txt
